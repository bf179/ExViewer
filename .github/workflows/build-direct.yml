name: Build (direct)

# 直连版：ujui 基线 + 我的功能补丁（只出 arm64-v8a，够手机用且快）
on:
  push:
    branches: [v2/ujui-direct, main]
  workflow_dispatch:

# 同一分支连续推送时，取消上一轮还在跑的构建，避免并行堆叠
concurrency:
  group: build-direct-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version-file: EhViewer/.java-version   # 基线与上游一致（当前 25）

      - name: Install Rust (pinned toolchain) + Android target
        working-directory: EhViewer
        run: |
          cat rust-toolchain.toml
          rustup show
          rustup target add aarch64-linux-android

      - name: Prepare tree (ujui patches + my patches)
        run: bash scripts/prepare-build.sh direct

      - name: Build release (arm64-v8a only)
        working-directory: EhViewer
        run: ./gradlew :app:assembleRelease -PonlyAbi=arm64-v8a --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ExViewer-direct-${{ github.run_number }}
          path: EhViewer/app/build/outputs/apk/**/app-default-arm64-v8a-release.apk
