name: CI

# 只做「补丁栈能否干净应用」的快速校验（约 10 秒）。
# 真正的编译验证交给 Build (direct) / Build (legacy pkg)，避免每次 push 跑 3 个全量构建。
on:
  push:
    branches:
      - '*'
  workflow_dispatch:

jobs:
  patches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify patch stack (direct)
        run: bash scripts/prepare-build.sh direct --check
