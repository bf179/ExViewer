name: Build (cai / proxy)

# 彩E 原版轨：Codeberg 彩E 最新 + 我的功能补丁，无直连（需代理）
on:
  push:
    branches: [v2/cai-proxy]
  schedule:
    - cron: '0 20 * * 0'   # 每周一 04:00 北京时间，自动构建最新彩E
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version-file: EhViewer/.java-version   # 基线与上游一致（当前 25）

      - name: Bump submodule to Codeberg HEAD
        run: |
          cd EhViewer
          git fetch --depth 1 origin main
          git checkout FETCH_HEAD
          git log -1 --oneline

      - name: Prepare tree (my patches only, no direct-connect)
        run: bash scripts/prepare-build.sh cai

      - name: Build release
        working-directory: EhViewer
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ExViewer-cai-${{ github.run_number }}
          path: EhViewer/app/build/outputs/apk/release/*.apk
