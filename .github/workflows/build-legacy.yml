name: Build (legacy pkg)

# 旧包名轨：applicationId = moe.tarsin.ehviefav，versionCode 180062 / versionName 1.13.1-sf
# 用途：覆盖安装旧版 → 直接读旧数据 / 导出旧库；与旧包同版本号，随时可装回旧包。
on:
  push:
    branches: [v2/ujui-direct, v2/cai-proxy]
    paths:
      - 'patches-local/**'
      - 'scripts/**'
      - '.github/workflows/build-legacy.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version-file: EhViewer/.java-version

      - name: Install Rust (pinned toolchain) + Android targets
        working-directory: EhViewer
        run: |
          cat rust-toolchain.toml
          rustup show
          rustup target add aarch64-linux-android armv7-linux-androideabi \
            thumbv7neon-linux-androideabi x86_64-linux-android

      - name: Prepare tree (legacy)
        run: bash scripts/prepare-build.sh legacy

      - name: Build release
        working-directory: EhViewer
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ExViewer-legacy-${{ github.run_number }}
          path: EhViewer/app/build/outputs/apk/**/*.apk
