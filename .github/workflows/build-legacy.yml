name: Build (legacy pkg)

# 旧包名轨：applicationId = moe.tarsin.ehviefav，versionCode 180062 / versionName 1.13.1-sf
# 用途：覆盖安装旧版 → 直接读旧数据 / 导出旧库；与旧包同版本号，随时可装回旧包。
# 只在打 tag（v*）或手动触发时构建，且只出 arm64-v8a。
# 不在每次 push 时构建：这条轨一年用不了几次，随提交跑纯属浪费算力。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version-file: EhViewer/.java-version

      - name: Install Rust (pinned toolchain) + Android target
        working-directory: EhViewer
        run: |
          cat rust-toolchain.toml
          rustup show
          rustup target add aarch64-linux-android

      - name: Prepare tree (legacy)
        run: bash scripts/prepare-build.sh legacy

      - name: Build release (arm64-v8a only)
        working-directory: EhViewer
        run: ./gradlew :app:assembleRelease -PonlyAbi=arm64-v8a --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ExViewer-legacy-${{ github.run_number }}
          path: EhViewer/app/build/outputs/apk/**/app-default-arm64-v8a-release.apk
